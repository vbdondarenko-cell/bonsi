name: Dispatch outbox emails

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/internal/emails
        run: |
          curl -sf -X POST "https://bonsi.site/api/internal/emails" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
