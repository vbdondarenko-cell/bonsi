<h2>Вхід у кабінет BONSI</h2>
<p>Ваш одноразовий код: <strong style="font-size:22px;letter-spacing:4px">{{ .Token }}</strong></p>
<p>Або відкрийте посилання: <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">Увійти</a></p>
<p>Код і посилання дійсні обмежений час і спрацьовують один раз. Якщо ви не запитували вхід, проігноруйте цей лист.</p>
